; Pilot Wnet Rev A (Radio Wnet) — ESP32-S3-WROOM-1-N16R8 + Ebyte E22-900M22S (SX1262) + W5500.
; Pochodzenie: variants/esp32s3/t-eth-elite/platformio.ini z meshtastic/firmware (develop), pobrany 18.10.2026,
; SHA-256 oryginału 6f7472e6b222eab624b401085a80d42e25a5563c5b8120c36e295b467a3f0ee0. Licencja GPL-3.0.
; Zmiany: własna flaga PILOT_WNET (sprzęt zgłaszany jako PRIVATE_HW), wykluczony GPS, ścieżka wariantu diy,
; board_level = extra (wariant spoza oficjalnej listy). Szczegóły różnic pinów: variant.h.
; Umieszczenie: <meshtastic/firmware>/variants/esp32s3/diy/pilot_wnet/ (root platformio.ini wczytuje
; variants/*/diy/*/platformio.ini). Szkic nieprzetestowany.
[env:pilot_wnet]
extends = esp32s3_base
board_level = extra
board = esp32s3box
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D PILOT_WNET
  -D HAS_UDP_MULTICAST=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -I variants/esp32s3/diy/pilot_wnet

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_ETH_ENABLED=y
  CONFIG_ARDUINO_SELECTIVE_Ethernet=y
