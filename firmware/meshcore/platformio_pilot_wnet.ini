; Pilot Wnet Rev A (Radio Wnet) — środowiska MeshCore dla własnej płytki ESP32-S3-WROOM-1-N16R8 + E22-900M22S.
;
; Pochodzenie: sekcja [LilyGo_TETH_Elite_sx1262] z variants/lilygo_teth_elite/platformio.ini repozytorium
; meshcore-dev/MeshCore (gałąź main), pobrany 18.10.2026; ostatni commit pliku
; c2d57f08c8dca367a202622f76c5a667b93a7b41 (9.08.2026), SHA-256 oryginału
; 68e1bb8530b9c4203b89b72c90bdf2e567702f9a054de312987bf2617c450386. MeshCore: licencja MIT
; (Copyright (c) 2025 Scott Powell / rippleradios.com) — przy rozpowszechnianiu zachować tę informację.
;
; Umieszczenie: skopiować jako <MeshCore>/variants/pilot_wnet/platformio.ini (root platformio.ini wczytuje
; variants/*/platformio.ini) albo jako <MeshCore>/platformio.local.ini. Kod płytki (target.cpp,
; TETHEliteBoard) bierzemy z variants/lilygo_teth_elite bez zmian.
;
; Różnice względem LilyGo_TETH_Elite_sx1262 (źródło pinów: pcb/obwod.py):
;  * P_LORA_RESET 46 → 2 (Rev A, R3 rozdz. 6.4).
;  * PIN_BOARD_SDA 17 / PIN_BOARD_SCL 18: ESP32Board::begin() bez tych flag woła Wire.begin() bez pinów,
;    a wtedy arduino-esp32 bierze domyślne SDA 41 / SCL 40 płytki esp32s3box — na naszej płytce to REC
;    i LORA_NSS (sprawdzone w arduino-esp32 2.0.17: Wire.cpp „use Default Pin” i
;    variants/esp32s3box/pins_arduino.h; że espressif32@6.11.0 niesie 2.0.17 — [DO WERYFIKACJI]).
;    Z flagami I2C idzie na OLED/Qwiic jak w Meshtastic [DO WERYFIKACJI testem na płytce].
;  * Własna flaga PILOT_WNET; LILYGO_TETH_ELITE zostaje, bo wybiera kod płytki w variants/lilygo_teth_elite.
; Bez zmian: DIO1 8, NSS 40, BUSY 16, SCK 10, MISO 9, MOSI 11, TX LED 38, DIO2 jako przełącznik RF,
; TCXO 1,8 V [DO WERYFIKACJI: Ebyte V1.5 podaje 2,2 V], limit prądu 140 mA, moc domyślna 8 dBm.
; Szkic nieprzetestowany: nie budowany na komputerze studyjnym; budowa w CI (firmware/ci/build-mesh.yml).

[PilotWnet_sx1262]
extends = esp32_base
board = esp32s3box
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_teth_elite
  -D BOARD_HAS_PSRAM
  -D LILYGO_TETH_ELITE
  -D LILYGO_T_ETH_ELITE_ESP32S3
  -D PILOT_WNET
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D P_LORA_DIO_1=8
  -D P_LORA_NSS=40
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=16
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=9
  -D P_LORA_MOSI=11
  -D P_LORA_TX_LED=38
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=8
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_teth_elite>
lib_deps =
  ${esp32_base.lib_deps}

; Radio towarzyszące przez USB (aplikacja MeshCore na komputerze) — bez haseł w pliku.
[env:PilotWnet_sx1262_companion_radio_usb]
extends = PilotWnet_sx1262
build_flags =
  ${PilotWnet_sx1262.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${PilotWnet_sx1262.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${PilotWnet_sx1262.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Przekaźnik (repeater): oryginał ma ADMIN_PASSWORD='"password"'. Tu hasło przychodzi ze zmiennej
; środowiskowej PILOT_MC_ADMIN_HASLO (sekret CI albo powłoka na maszynie budującej) — nigdy w repozytorium.
; Pusta albo nieustawiona zmienna dałaby ADMIN_PASSWORD="" (PlatformIO podstawia pusty tekst), dlatego
; skrypt wymagaj_hasla.py (skopiować obok tego pliku do variants/pilot_wnet/) przerywa wtedy budowę.
; merge-bin.py pochodzi z [esp32_base] (MeshCore 81dbae59) — powtórzony, bo extra_scripts się nadpisuje.
; Cykl pracy: MeshCore ogranicza czas nadawania współczynnikiem „af” (airtime factor) — wartość domyślną
; i jej przełożenie na cykl pracy sprawdzić przed użyciem w paśmie 54 (≤ 10 %) [DO WERYFIKACJI w kodzie
; MeshCore]; ten plik niczego tu nie zmienia.
[env:PilotWnet_sx1262_repeater]
extends = PilotWnet_sx1262
extra_scripts =
  pre:variants/pilot_wnet/wymagaj_hasla.py
  merge-bin.py
build_flags =
  ${PilotWnet_sx1262.build_flags}
  -D ADVERT_NAME='"Pilot Wnet Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"${sysenv.PILOT_MC_ADMIN_HASLO}"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${PilotWnet_sx1262.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${PilotWnet_sx1262.lib_deps}
  ${esp32_ota.lib_deps}
